name: codecats
description: "CodeCats - aprende C++ con memes de gatos / learn C++ with cat memes"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  code_text_field: ^1.1.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  flutter_js: ^0.8.2
  web: ^1.0.0
  audioplayers: ^6.8.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vendor/
    - assets/memes/
    - assets/profe.png
    - assets/boss.png
    - assets/music/
