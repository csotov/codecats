<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CodeCats — aprende C++ peleando batallas de código / learn C++ fighting code battles">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CodeCats">
  <meta name="theme-color" content="#14091F">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>CodeCats</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #14091F; height: 100%; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 35%, #1F0F30 0%, #14091F 70%);
      font-family: system-ui, sans-serif;
      transition: opacity .45s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .sword {
      font-size: 64px; animation: pulse 1.1s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(76,194,255,.55));
    }
    #splash .title {
      color: #FFF6FF; font-size: 34px; font-weight: 900;
      letter-spacing: 1px;
    }
    #splash .title em { color: #FF4DDB; font-style: normal; }
    #splash .tag {
      color: #B99BD4; font-size: 14px;
    }
    #splash .bar {
      width: 210px; height: 6px; border-radius: 3px;
      background: #1F0F30; overflow: hidden;
    }
    #splash .bar i {
      display: block; height: 100%; width: 40%;
      border-radius: 3px; background: linear-gradient(90deg,#FF4DDB,#B6FF3D);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
    @keyframes slide { 0% { margin-left: -40% } 100% { margin-left: 100% } }
  </style>
  <script>
    // PostHog: pantallas, pasos clave y grabación de sesiones (con su código), solo en el
    // juego publicado (no local, ni vistas previas, ni demos).
    (function () {
      var l = location;
      if (l.hostname !== 'csotov.github.io' || l.pathname.indexOf('/codecats/') !== 0 ||
          /[?&]demo=/.test(l.search)) return;

      posthog.init('phc_mzUm2AQ6dMngugGRkTEP6FKHs3ZtexibmeGF4AUQXp7F', {
        api_host: 'https://us.i.posthog.com',
        person_profiles: 'identified_only',
        persistence: 'localStorage',
        capture_pageview: true,
        capture_pageleave: true,
        autocapture: false,
        disable_surveys: true,
        advanced_disable_flags: true,
        session_recording: {
          maskAllInputs: false,
          maskInputOptions: { password: true },
          recordHeaders: false,
          recordBody: false,
          captureCanvas: { recordCanvas: true, canvasFps: 2, canvasQuality: '0.4' },
          maskCapturedNetworkRequestFn: function (r) {
            r.name = r.name.split('?')[0].split('#')[0];
            return r;
          }
        }
      });
      posthog.register({ app: 'codecats' });
    })();
  </script>
</head>
<body>
  <div id="splash">
    <div class="sword">🐱</div>
    <div class="title">Code<em>Cats</em></div>
    <div class="tag">Aprende C++ coleccionando gatos</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    {{flutter_service_worker_version}}

    window.addEventListener('load', function () {
      var splash = document.getElementById('splash');
      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          var appRunner = await engineInitializer.initializeEngine();
          await appRunner.runApp();
          // first frame is up — fade the splash out
          splash.classList.add('hide');
          setTimeout(function () { splash.remove(); }, 500);
        }
      });
    });
  </script>
</body>
</html>
